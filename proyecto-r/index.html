<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto R — nu metal argentino</title>
  <meta name="description" content="Proyecto R, banda ficticia de nu metal argentino. Canciones y letras.">
  <meta property="og:title" content="Proyecto R — nu metal argentino">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <header class="hero">
    <div class="wrap hero-inner">
      <p class="eyebrow">Nu metal · Buenos Aires</p>
      <h1>Proyecto <em>R</em></h1>
      <p class="lead">Riffs afinados abajo, versos rapeados y estribillos para gritar.</p>
      <button class="btn" id="playAll" type="button">▶ Escuchar desde el principio</button>
    </div>
  </header>

  <main class="wrap">
    <h2 class="section-title">Canciones</h2>
    <ol class="tracks" id="tracks"></ol>

    <section class="lyrics" id="lyrics" hidden>
      <p class="eyebrow" id="lyricsScene"></p>
      <h2 id="lyricsTitle"></h2>
      <div id="lyricsBody" class="lyrics-body"></div>
    </section>
  </main>

  <footer class="wrap foot">
    <p>Proyecto R es una banda ficticia. Música y letras: Luis Fader · <a href="../">Volver a La Corazonada</a></p>
  </footer>

  <div class="player" id="player" hidden>
    <button class="pbtn" id="prev" type="button" aria-label="Anterior">⏮</button>
    <button class="pbtn big" id="toggle" type="button" aria-label="Reproducir">▶</button>
    <button class="pbtn" id="next" type="button" aria-label="Siguiente">⏭</button>
    <div class="pinfo">
      <span id="nowTitle"></span>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Posición">
    </div>
    <span class="ptime" id="time">0:00</span>
  </div>
  <audio id="audio" preload="none"></audio>

  <script src="canciones.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
